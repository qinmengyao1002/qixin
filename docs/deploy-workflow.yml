name: Deploy Qixin Sanctuary
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: qixin-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - name: Bind production database
        env:
          QIXIN_D1_ID: ${{ vars.QIXIN_D1_ID }}
        run: node scripts/bind-production-db.mjs
      - name: Apply migrations and deploy the game
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 migrations apply DB --config dist/server/wrangler.json --remote
          npx --no-install wrangler deploy --config dist/server/wrangler.json
